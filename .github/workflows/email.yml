name: Daily digest email

# 7:30am Sydney every day: emails the result of the most recent supplier sync (normally the 2am run) to
# Joshua, Will and Billy. If no sync has finished in the last 12 hours, the email says so.
on:
  schedule:
    - cron: "30 20 * * *"   # 7:30am AEDT
    - cron: "30 21 * * *"   # 7:30am AEST
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Only at 7:30am Sydney
        id: gate
        run: |
          H=$(TZ=Australia/Sydney date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$H" != "07" ]; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
      - name: Fetch the latest sync result
        id: latest
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh run list --workflow sync.yml --status completed --limit 10 --json databaseId,conclusion,createdAt,event \
                --jq '[.[] | select(.conclusion != "skipped" and .conclusion != "cancelled")][0]')
          ID=$(echo "$RUN" | python3 -c "import json,sys; print(json.load(sys.stdin)['databaseId'])")
          CONC=$(echo "$RUN" | python3 -c "import json,sys; print(json.load(sys.stdin)['conclusion'])")
          AGE=$(echo "$RUN" | python3 -c "import json,sys,datetime; c=datetime.datetime.fromisoformat(json.load(sys.stdin)['createdAt'].replace('Z','+00:00')); print(int((datetime.datetime.now(datetime.timezone.utc)-c).total_seconds()//3600))")
          echo "Latest sync run $ID, $CONC, $AGE hours ago"
          echo "url=${{ github.server_url }}/${{ github.repository }}/actions/runs/$ID" >> "$GITHUB_OUTPUT"
          if [ "$AGE" -le 12 ] && gh run download "$ID" -n sync-report -D .; then
            echo "status=$CONC" >> "$GITHUB_OUTPUT"
          else
            echo "No sync finished in the last 12 hours, or its report is missing."; rm -f report.json; echo "status=failure" >> "$GITHUB_OUTPUT"
          fi
      - name: Send the digest
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ steps.latest.outputs.url }}
          JOB_STATUS: ${{ steps.latest.outputs.status }}
          EMAIL_TO: ${{ vars.EMAIL_TO || 'joshua.b@gtstreet.au,will.k@gtstreet.au,billy@breadenmedia.com.au' }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_SENDER: ${{ vars.MS_SENDER || 'joshua.b@gtstreet.au' }}
        run: python3 notify.py
