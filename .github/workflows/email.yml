name: Daily digest email

# 7am Sydney every day: one email to Joshua, Will and Billy summarising both checks since the last email
# (yesterday's 12pm run and this morning's 1am run). If a check is still running at 7am, it waits up to an hour for it. Missing runs are reported in the email.
on:
  schedule:
    - cron: "0 20 * * *"   # 7am AEDT
    - cron: "0 21 * * *"   # 7am AEST
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Only at 7am Sydney
        id: gate
        run: |
          H=$(TZ=Australia/Sydney date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$H" != "07" ]; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
      - name: Wait for a check that is still running (up to 60 minutes)
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            N=$(gh run list --workflow sync.yml --status in_progress --json databaseId --jq 'length')
            [ "$N" = "0" ] && break
            echo "A check is still running; waiting ($i min)"; sleep 60
          done
      - name: Fetch the sync results from the last 24 hours
        id: latest
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow sync.yml --limit 20 --json databaseId,conclusion,status,createdAt,event > runs.json
          python3 - <<'PY' > picked.txt
          import json, datetime
          now = datetime.datetime.now(datetime.timezone.utc)
          runs = [r for r in json.load(open("runs.json")) if r["status"] == "completed" and r["conclusion"] not in ("skipped", "cancelled")
                  and (now - datetime.datetime.fromisoformat(r["createdAt"].replace("Z", "+00:00"))).total_seconds() < 24 * 3600]
          for r in reversed(runs[:2]):  # oldest first
              print(r["databaseId"], r["conclusion"], r["createdAt"])
          PY
          cat picked.txt
          DIRS=""; STAT="success"; URLS=""
          while read ID CONC CREATED; do
            if gh run download "$ID" -n sync-report -D "run_$ID"; then DIRS="$DIRS run_$ID|$CONC|$CREATED|${{ github.server_url }}/${{ github.repository }}/actions/runs/$ID"; fi
          done < picked.txt
          echo "dirs=$DIRS" >> "$GITHUB_OUTPUT"
      - name: Send the digest
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPORT_DIRS: ${{ steps.latest.outputs.dirs }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/sync.yml
          JOB_STATUS: success
          EMAIL_TO: ${{ vars.EMAIL_TO || 'joshua.b@gtstreet.au,will.k@gtstreet.au,billy@breadenmedia.com.au' }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_SENDER: ${{ vars.MS_SENDER || 'joshua.b@gtstreet.au' }}
        run: python3 notify.py
