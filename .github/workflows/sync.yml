name: Supplier price and stock sync

# 1am and 12pm Sydney every day: each full run covers every supplier (CNC Wheels, XForce, BC Racing, Alu-Cab, H&R via Revzone)
# is read live from its own website, nothing cached, and the results are applied to Shopify. Then an independent
# recheck of every amended product. Nothing is emailed from here: the 7am Daily digest covers every run, manual ones included.
on:
  schedule:
    # GitHub schedules in UTC: one entry for daylight time, one for standard time. digest.py gate keeps the one whose
    # due time is 1am or 12pm in Sydney (judged on the due time, so a late start by GitHub still runs). :17 past avoids
    # the top of the hour, when GitHub is busiest and most likely to drop scheduled runs.
    - cron: "17 14 * * *"   # 1:17am AEDT
    - cron: "17 15 * * *"   # 1:17am AEST
    - cron: "17 1 * * *"    # 12:17pm AEDT
    - cron: "17 2 * * *"    # 12:17pm AEST
  workflow_dispatch:
    inputs:
      only:
        description: "Leave blank to run every supplier (normal). For a test of one supplier only, type e.g. cnc or xforce."
        type: string
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  # Separate job so the other-season duplicate cron ends here and never queues behind (or cancels) a real check.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - name: "1am and 12pm Sydney every day, every supplier"
        id: gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 digest.py gate "${{ github.event.schedule }}" 1 12 | tee -a "$GITHUB_OUTPUT"
  sync:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: cnc-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read every supplier website live and apply prices and stock
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          DRY_RUN: "0"
          PRICE_OFFSET: ${{ vars.PRICE_OFFSET || '1' }}
          MIN_PRICE: ${{ vars.MIN_PRICE || '10' }}
          BIG_DROP: ${{ vars.BIG_DROP || '0.20' }}
          ONLY: ${{ inputs.only || '' }}
        run: python3 sync.py
      - name: Sales channel coverage
        if: always()
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          DRY_RUN: "0"
          PRICE_OFFSET: ${{ vars.PRICE_OFFSET || '1' }}
          MIN_PRICE: ${{ vars.MIN_PRICE || '10' }}
          BIG_DROP: ${{ vars.BIG_DROP || '0.20' }}
          ONLY: ${{ inputs.only || '' }}
        run: python3 channels.py
      - name: Description upkeep
        if: always()
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          DRY_RUN: "0"
          PRICE_OFFSET: ${{ vars.PRICE_OFFSET || '1' }}
          MIN_PRICE: ${{ vars.MIN_PRICE || '10' }}
          BIG_DROP: ${{ vars.BIG_DROP || '0.20' }}
          ONLY: ${{ inputs.only || '' }}
        run: python3 maintenance.py
      - name: Independent re-check against supplier websites
        if: (success() || failure())
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          DRY_RUN: "0"
          PRICE_OFFSET: ${{ vars.PRICE_OFFSET || '1' }}
          MIN_PRICE: ${{ vars.MIN_PRICE || '10' }}
          BIG_DROP: ${{ vars.BIG_DROP || '0.20' }}
          ONLY: ${{ inputs.only || '' }}
        run: python3 verify.py
      - name: Summary
        if: always()
        run: |
          test -f report.md && cat report.md >> "$GITHUB_STEP_SUMMARY" || echo "No sync report" >> "$GITHUB_STEP_SUMMARY"
          for f in verify.md channels.md maintenance.md; do test -f $f && cat $f >> "$GITHUB_STEP_SUMMARY" || true; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-report
          path: |
            report.md
            report.json
            verify.md
            verify.json
            channels.md
            maintenance.md
          retention-days: 60
