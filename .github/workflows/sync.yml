name: Supplier price and stock sync

on:
  schedule:
    # 2am and 2pm Sydney all year. GitHub schedules in UTC, so each run is listed for both daylight time and
    # standard time; the first step skips whichever one isn't 2am or 2pm in Sydney that day.
    - cron: "0 15 * * *"   # 2am AEDT
    - cron: "0 16 * * *"   # 2am AEST
    - cron: "0 3 * * *"    # 2pm AEDT
    - cron: "0 4 * * *"    # 2pm AEST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: report only, change nothing"
        type: boolean
        default: true
      only:
        description: "Run only these suppliers, comma separated (e.g. xforce or cnc,bcracing). Blank runs everything."
        type: string
        default: ""

concurrency:
  group: cnc-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Only run at 2am or 2pm Sydney time
        id: gate
        run: |
          H=$(TZ=Australia/Sydney date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$H" != "02" ] && [ "$H" != "14" ]; then
            echo "Not 2am or 2pm in Sydney (daylight saving switch); skipping this trigger."; echo "go=false" >> "$GITHUB_OUTPUT"
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi
          # 2am: full run including CNC (about 80 to 120 minutes). 2pm: quick run of the Shopify-platform
          # suppliers only (about 5 minutes), to stay within GitHub's included Actions minutes.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$H" = "14" ]; then
            echo "only=suppliers" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
      - name: Restore CNC page cache
        if: steps.gate.outputs.go == 'true'
        uses: actions/cache/restore@v4
        with:
          path: cnc_cache.json
          key: cnc-cache-${{ github.run_id }}
          restore-keys: cnc-cache-
      - name: Run sync
        if: steps.gate.outputs.go == 'true'
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          # Scheduled runs are live: they apply prices and stock automatically. Manual runs follow the dry_run tick box.
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
          PRICE_OFFSET: ${{ vars.PRICE_OFFSET || '1' }}
          MIN_PRICE: ${{ vars.MIN_PRICE || '10' }}
          MAX_DROP: ${{ vars.MAX_DROP || '0.20' }}
          JJ_MIN_PRICE: ${{ vars.JJ_MIN_PRICE || '5' }}
          ONLY: ${{ inputs.only || steps.gate.outputs.only || '' }}
        run: python3 sync.py
      - name: Save CNC page cache
        if: steps.gate.outputs.go == 'true' && (always() && hashFiles('cnc_cache.json') != '')
        uses: actions/cache/save@v4
        with:
          path: cnc_cache.json
          key: cnc-cache-${{ github.run_id }}
      - name: Sales channel coverage
        if: steps.gate.outputs.go == 'true' && (always())
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          # Scheduled runs are live: they apply prices and stock automatically. Manual runs follow the dry_run tick box.
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
          PRICE_OFFSET: ${{ vars.PRICE_OFFSET || '1' }}
          MIN_PRICE: ${{ vars.MIN_PRICE || '10' }}
          MAX_DROP: ${{ vars.MAX_DROP || '0.20' }}
          JJ_MIN_PRICE: ${{ vars.JJ_MIN_PRICE || '5' }}
          ONLY: ${{ inputs.only || steps.gate.outputs.only || '' }}
        run: python3 channels.py
      - name: Summary
        if: steps.gate.outputs.go == 'true' && (always())
        run: |
          test -f report.md && cat report.md >> "$GITHUB_STEP_SUMMARY" || echo "No sync report" >> "$GITHUB_STEP_SUMMARY"
          test -f channels.md && cat channels.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.go == 'true' && (always())
        with:
          name: sync-report
          path: |
            report.md
            report.json
            channels.md
          retention-days: 30
