name: Supplier price and stock sync

# 2am Sydney, Monday to Friday: CNC Wheels every weekday; Monday, Wednesday and Friday the full run covers every supplier (CNC Wheels, XForce, BC Racing, Alu-Cab, H&R via Revzone)
# is read live from its own website, nothing cached, and the results are applied to Shopify. Then an independent
# re-check, and an email to sales@gtstreet.au with every price and stock change.
on:
  schedule:
    # GitHub schedules in UTC: one entry for daylight time, one for standard time. The first step keeps only 2am Sydney.
    - cron: "0 15 * * *"   # 2am AEDT
    - cron: "0 16 * * *"   # 2am AEST
  workflow_dispatch:
    inputs:
      only:
        description: "Leave blank to run every supplier (normal). For a test of one supplier only, type e.g. cnc or xforce."
        type: string
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: cnc-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: "2am Sydney weekdays: every supplier Mon, Wed, Fri; CNC only Tue, Thu"
        id: gate
        run: |
          H=$(TZ=Australia/Sydney date +%H); D=$(TZ=Australia/Sydney date +%u)   # D: 1 = Monday ... 7 = Sunday
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$H" != "02" ] || [ "$D" -gt 5 ]; }; then
            echo "Not 2am on a weekday in Sydney; skipping this trigger."; echo "go=false" >> "$GITHUB_OUTPUT"
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$D" = "2" ] || [ "$D" = "4" ]; }; then
            echo "CNC only today (Tuesday or Thursday)."; echo "only=cnc" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
      - name: Read every supplier website live and apply prices and stock
        if: steps.gate.outputs.go == 'true'
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          DRY_RUN: "0"
          PRICE_OFFSET: ${{ vars.PRICE_OFFSET || '1' }}
          MIN_PRICE: ${{ vars.MIN_PRICE || '10' }}
          MAX_DROP: ${{ vars.MAX_DROP || '0.20' }}
          ONLY: ${{ inputs.only || steps.gate.outputs.only || '' }}
        run: python3 sync.py
      - name: Sales channel coverage
        if: steps.gate.outputs.go == 'true' && always()
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          DRY_RUN: "0"
          PRICE_OFFSET: ${{ vars.PRICE_OFFSET || '1' }}
          MIN_PRICE: ${{ vars.MIN_PRICE || '10' }}
          MAX_DROP: ${{ vars.MAX_DROP || '0.20' }}
          ONLY: ${{ inputs.only || steps.gate.outputs.only || '' }}
        run: python3 channels.py
      - name: Description upkeep
        if: steps.gate.outputs.go == 'true' && always()
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          DRY_RUN: "0"
          PRICE_OFFSET: ${{ vars.PRICE_OFFSET || '1' }}
          MIN_PRICE: ${{ vars.MIN_PRICE || '10' }}
          MAX_DROP: ${{ vars.MAX_DROP || '0.20' }}
          ONLY: ${{ inputs.only || steps.gate.outputs.only || '' }}
        run: python3 maintenance.py
      - name: Independent re-check against supplier websites
        if: steps.gate.outputs.go == 'true' && (success() || failure())
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          DRY_RUN: "0"
          PRICE_OFFSET: ${{ vars.PRICE_OFFSET || '1' }}
          MIN_PRICE: ${{ vars.MIN_PRICE || '10' }}
          MAX_DROP: ${{ vars.MAX_DROP || '0.20' }}
          ONLY: ${{ inputs.only || steps.gate.outputs.only || '' }}
        run: python3 verify.py
      - name: Email sales@gtstreet.au
        if: steps.gate.outputs.go == 'true' && always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          EMAIL_TO: ${{ vars.EMAIL_TO || 'sales@gtstreet.au' }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_SENDER: ${{ vars.MS_SENDER || 'sales@gtstreet.au' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python3 notify.py
      - name: Summary
        if: steps.gate.outputs.go == 'true' && always()
        run: |
          test -f report.md && cat report.md >> "$GITHUB_STEP_SUMMARY" || echo "No sync report" >> "$GITHUB_STEP_SUMMARY"
          for f in verify.md channels.md maintenance.md; do test -f $f && cat $f >> "$GITHUB_STEP_SUMMARY" || true; done
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.go == 'true' && always()
        with:
          name: sync-report
          path: |
            report.md
            report.json
            verify.md
            channels.md
            maintenance.md
            price_changes.csv
            email.html
          retention-days: 60
