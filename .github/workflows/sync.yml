name: Supplier price and stock sync
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.source == 'scheduler' && 'Scheduled check (external timer)' || github.event_name == 'schedule' && format('Scheduled sync ({0})', github.event.schedule) || 'Supplier price and stock sync' }}

# Every 6 hours (3:17am, 9:17am, 3:17pm, 9:17pm Sydney): each full run covers every supplier (CNC Wheels, XForce, BC Racing, Alu-Cab, H&R via Revzone)
# is read live from its own website, nothing cached, and the results are applied to Shopify. Then an independent
# recheck of every amended product. Nothing is emailed from here: the 10am Daily digest covers every run, manual ones included.
on:
  schedule:
    # GitHub schedules in UTC: one entry for daylight time, one for standard time. digest.py gate keeps the one whose
    # due time is 3, 9, 15 or 21 o'clock in Sydney (judged on the due time, so a late start by GitHub still runs). :17 past avoids
    # the top of the hour, when GitHub is busiest and most likely to drop scheduled runs.
    - cron: "17 16 * * *"   # 3:17am AEDT
    - cron: "17 17 * * *"   # 3:17am AEST
    - cron: "17 22 * * *"   # 9:17am AEDT
    - cron: "17 23 * * *"   # 9:17am AEST
    - cron: "17 4 * * *"    # 3:17pm AEDT
    - cron: "17 5 * * *"    # 3:17pm AEST
    - cron: "17 10 * * *"   # 9:17pm AEDT
    - cron: "17 11 * * *"   # 9:17pm AEST
  workflow_dispatch:
    inputs:
      only:
        description: "Leave blank to run every supplier (normal). For a test of one supplier only, type e.g. cnc, xforce, or portals (dealer portals only)."
        type: string
        default: ""
      dry_run:
        description: "Tick for a dry run of the dealer portals: they are read and compared, nothing is changed in Shopify, even if PORTALS_APPLY is 1."
        type: boolean
        default: false
      source:
        description: "Set to scheduler only by the external timer (cron-job.org). Leave blank for a manual run."
        type: string
        default: ""

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  # Separate job so the other-season duplicate cron ends here and never queues behind (or cancels) a real check.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - name: "Every 6 hours Sydney time, every supplier"
        id: gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 digest.py gate "${{ github.event.schedule }}" 3 9 15 21 | tee -a "$GITHUB_OUTPUT"
  sync:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: cnc-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dealer portal stock (NYC Dealerline, Equipit)
        # Runs before the CNC step so CNC leaves the stock of portal matched wheels alone (portals_ids.json). Otherwise CNC
        # set ~3,200 variants to In stock and the portal step set them straight back, every run.
        if: inputs.only == '' || inputs.only == null || contains(inputs.only, 'portals')
        continue-on-error: true
        timeout-minutes: 45
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          NYC_USER: ${{ secrets.NYC_USER }}
          NYC_PASS: ${{ secrets.NYC_PASS }}
          EQUIPIT_USER: ${{ secrets.EQUIPIT_USER }}
          EQUIPIT_PASS: ${{ secrets.EQUIPIT_PASS }}
          PORTALS_APPLY: ${{ inputs.dry_run && '0' || vars.PORTALS_APPLY || '0' }}
          TD_PRICES_APPLY: ${{ inputs.dry_run && '0' || vars.TD_PRICES_APPLY || '0' }}
          EQUIPIT_VENDORS: ${{ vars.EQUIPIT_VENDORS || 'Tough Dog' }}
        run: |
          python3 -m pip install -q playwright && python3 -m playwright install --with-deps chromium > /dev/null
          python3 -W ignore portals.py
      - name: Read every supplier website live and apply prices and stock
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          DRY_RUN: "0"
          PRICE_OFFSET: ${{ vars.PRICE_OFFSET || '1' }}
          MIN_PRICE: ${{ vars.MIN_PRICE || '10' }}
          BIG_DROP: ${{ vars.BIG_DROP || '0.20' }}
          ONLY: ${{ inputs.only || '' }}
        run: python3 sync.py
      - name: Sales channel coverage
        if: always()
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          DRY_RUN: "0"
          PRICE_OFFSET: ${{ vars.PRICE_OFFSET || '1' }}
          MIN_PRICE: ${{ vars.MIN_PRICE || '10' }}
          BIG_DROP: ${{ vars.BIG_DROP || '0.20' }}
          ONLY: ${{ inputs.only || '' }}
        run: python3 channels.py
      - name: Description upkeep
        if: always()
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          DRY_RUN: "0"
          PRICE_OFFSET: ${{ vars.PRICE_OFFSET || '1' }}
          MIN_PRICE: ${{ vars.MIN_PRICE || '10' }}
          BIG_DROP: ${{ vars.BIG_DROP || '0.20' }}
          ONLY: ${{ inputs.only || '' }}
        run: python3 maintenance.py
      - name: Independent re-check against supplier websites
        if: (success() || failure())
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          DRY_RUN: "0"
          PRICE_OFFSET: ${{ vars.PRICE_OFFSET || '1' }}
          MIN_PRICE: ${{ vars.MIN_PRICE || '10' }}
          BIG_DROP: ${{ vars.BIG_DROP || '0.20' }}
          ONLY: ${{ inputs.only || '' }}
        run: python3 verify.py
      - name: Summary
        if: always()
        run: |
          test -f report.md && cat report.md >> "$GITHUB_STEP_SUMMARY" || echo "No sync report" >> "$GITHUB_STEP_SUMMARY"
          for f in verify.md channels.md maintenance.md portals.md; do test -f $f && cat $f >> "$GITHUB_STEP_SUMMARY" || true; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-report
          path: |
            report.md
            report.json
            verify.md
            verify.json
            channels.md
            maintenance.md
            portals.md
            portals.json
          retention-days: 60

